services:
  adaptation-insights-client:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    ports:
      - "3001:3000"
    mem_limit: 1g
    mem_reservation: 700m
    healthcheck:
      # wget: alpine has no curl. 127.0.0.1: localhost resolves to ::1 but next listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      retries: 3
      start_period: 40s
    restart: unless-stopped
